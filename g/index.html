<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ذكرياتنا الجميلة ❤️</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating Ambient Particles Container -->
  <div class="floats-container" id="floatsContainer"></div>

  <!-- Password Overlay Gate (Heart Card) -->
  <div id="passwordOverlay" class="password-overlay">
    <div class="heart-container">
      <div class="big-heart"></div>
      <div class="password-card custom-card">
        <div class="photo-circle-wrap">
          <div class="photo-circle">
            <img id="gateAvatar" src="https://via.placeholder.com/150" alt="Avatar">
          </div>
        </div>
        <h2 id="gateTitle">عالمنا الخاص ✨</h2>
        <p id="gateSubtitle">أدخلي كلمة السر للدخول ❤️</p>
        
        <form id="passwordForm" onsubmit="return false;">
          <div class="input-group">
            <input type="password" id="passInput" placeholder="••••" maxlength="10" autocomplete="off" required>
          </div>
          <button type="submit" id="unlockBtn" class="btn-unlock">
            <span>فتح الصفحة</span> <i class="fa-solid fa-key"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Main Website Content -->
  <div id="mainContent" class="hidden">
    
    <!-- Navbar -->
    <header class="main-header">
      <div class="container navbar">
        <div class="brand-logo">
          <i class="fa-solid fa-heart" style="color: var(--primary-color);"></i> <span id="siteLogoText">ذكرياتنا</span>
        </div>
        <div class="nav-actions">
          <a href="admin/index.html" class="btn-primary" style="padding: 8px 16px; font-size: 13px;">
            <i class="fa-solid fa-user-gear"></i> لوحة التحكم
          </a>
        </div>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-card">
          <div class="hero-img-wrapper">
            <img id="heroImage" src="https://via.placeholder.com/600x400" alt="Hero Image">
          </div>
          <div class="hero-text-content">
            <h1 id="heroTitle">أهلاً بكِ يا أميرتي ❤️</h1>
            <p id="heroDescription">هذا المكان تم إنشاؤه خصيصاً ليجمع كل لحظاتنا الجميلة وذكرياتنا المميزة معاً.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Countdown Section -->
    <section class="countdown-section">
      <div class="container">
        <div class="countdown-box-wrapper">
          <h2 id="countdownTitle">العد التنازلي لمناسبتنا القادمة ✨</h2>
          <div class="countdown-timer" id="countdownTimer">
            <div class="time-box"><span id="days">00</span><label>يوم</label></div>
            <div class="time-box"><span id="hours">00</span><label>ساعة</label></div>
            <div class="time-box"><span id="minutes">00</span><label>دقيقة</label></div>
            <div class="time-box"><span id="seconds">00</span><label>ثانية</label></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Romantic Sentences Section -->
    <section class="sentences-section">
      <div class="container">
        <h2 class="section-title">رسائل من القلب 💌</h2>
        <div class="sentences-grid" id="sentencesGrid">
          <!-- Dynamically populated from JS -->
        </div>
      </div>
    </section>

    <!-- Photo Gallery Section -->
    <section class="photos-section">
      <div class="container">
        <h2 class="section-title">معرض الصور 📸</h2>
        <div class="photos-grid" id="photosGrid">
          <!-- Dynamically populated from JS -->
        </div>
      </div>
    </section>

    <!-- Videos Section -->
    <section class="videos-section">
      <div class="container">
        <h2 class="section-title">فيديوهاتنا المميزة 🎥</h2>
        <div class="videos-grid" id="videosGrid">
          <!-- Dynamically populated from JS -->
        </div>
      </div>
    </section>

  </div>

  <!-- Firebase Scripts & Core JS -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
