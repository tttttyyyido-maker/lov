<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I love you 💖</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الفراشات والقلوب الطافية -->
  <div class="floats-container" id="floatsContainer">
    <div class="float-item">🦋</div>
    <div class="float-item">💜</div>
    <div class="float-item">🦋</div>
    <div class="float-item">🦋</div>
    <div class="float-item">💜</div>
  </div>

  <!-- 1. بوابه كلمة السر (تصميم القلب) -->
  <div id="passwordOverlay" class="login-container">
    <div class="heart-container">
      <div class="big-heart"></div>
      <div class="login-content">
        
        <div class="photo-circle-wrap">
          <div class="photo-circle">
            <img id="gateAvatar" src="https://res.cloudinary.com/dvc3zpg1i/image/upload/f_auto,q_auto/v1784320611/clients/hjbzd9vmpjbognmp3elg.jpg" alt="photo">
          </div>
        </div>

        <h1 class="login-title" id="gateTitle">جاهزه؟؟</h1>
        <p class="login-subtitle" id="gateSubtitle">my everything</p>

        <div class="glass-login-card">
          <form id="passwordForm" onsubmit="return false;">
            <div class="input-group">
              <label for="passInput">Password</label>
              <input type="text" id="passInput" placeholder="password" required>
            </div>
            <!-- تم تعديل نوع الزرار هنا إلى type="button" -->
            <button type="button" id="unlockBtn" class="login-btn"> Unlock </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- المحتوى الرئيسي بعد فك كلمة السر -->
  <div id="mainContent" class="hidden">
    
    <!-- 2. خطوة خيارات الحب -->
    <div id="loveQuestionStep" class="step-container">
      <div class="love-choices">
        <div class="choice-card yes-card" onclick="showMemoriesSection()">
          <span class="choice-icon">💜</span>
          <p class="choice-text">بتحبيني؟</p>
        </div>
        
        <div class="choice-card no-card" id="noBtn">
          <span class="choice-icon">😒</span>
          <p class="choice-text">مش بتحبيني؟</p>
        </div>
      </div>
    </div>

    <!-- 3. خطوة العداد والمشغل -->
    <div id="memoriesStep" class="step-container hidden">
      <p class="top-note">الهديه دي ليكي وبس ونفضل نضيف كل الي بينا هنا</p>
      
      <h2 class="section-title">بدايتنا❤️</h2>
      
      <div class="countdown-card">
        <div class="countdown-grid">
          <div class="timer-box">
            <span class="timer-number" id="days">372</span>
            <span class="timer-label">يوم</span>
          </div>
          <div class="timer-box">
            <span class="timer-number" id="hours">3</span>
            <span class="timer-label">ساعة</span>
          </div>
          <div class="timer-box">
            <span class="timer-number" id="minutes">28</span>
            <span class="timer-label">دقيقة</span>
          </div>
          <div class="timer-box">
            <span class="timer-number" id="seconds">32</span>
            <span class="timer-label">ثانية</span>
          </div>
        </div>
        <p class="countdown-subtext">كل ثانية بتعدي وانا ديما بفكر فيكي</p>
      </div>

      <!-- مشغل الأغاني -->
      <div class="music-player-card">
        <div class="player-info">
          <span class="song-title">ومفيش الا عينيك 😍</span>
          <span class="song-count">1/1</span>
        </div>
        <div class="player-controls">
          <button class="control-btn">⏮</button>
          <button class="control-btn play-btn">⏸</button>
          <button class="control-btn">⏭</button>
        </div>
      </div>
    </div>

  </div>

<script src="js/firebase.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
