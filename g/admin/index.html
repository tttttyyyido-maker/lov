<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Story 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #FFCBD7;
      color: #7A2846;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(210, 100, 130, 0.2);
    }
    h1 { color: #C03960; font-size: 2em; margin-bottom: 5px; font-weight: 900; }
    .sub { color: #E2507B; font-weight: 700; margin-bottom: 20px; }
    .hero-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #FF85A2;
      margin: 10px auto 20px auto;
      display: block;
    }
    .msg-box {
      background: #FFF0F3;
      padding: 20px;
      border-radius: 18px;
      border: 2px dashed #FFB0C2;
      margin-bottom: 20px;
    }
    .msg-title { color: #C03960; font-weight: 800; font-size: 1.2em; margin-bottom: 8px; }
    .msg-body { font-size: 1em; line-height: 1.6; color: #61132C; font-weight: 600; }
    .counter-sub { font-size: 0.9em; font-weight: 700; color: #8C2443; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="pageTitleDisplay">...</h1>
    <div class="sub" id="subTitleDisplay">...</div>
    
    <img id="heroImgDisplay" class="hero-img" src="" alt="love" style="display: none;">

    <div class="msg-box">
      <div class="msg-title" id="msgTitleDisplay">...</div>
      <div class="msg-body" id="msgBodyDisplay">...</div>
    </div>

    <div class="counter-sub" id="counterSubDisplay">...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFHcU7H24qU3OlJRdTe27ZxgwnFRzYxvE",
      authDomain: "love-18e03.firebaseapp.com",
      projectId: "love-18e03",
      storageBucket: "love-18e03.firebasestorage.app",
      messagingSenderId: "716078539990",
      appId: "1:716078539990:web:6198dd38a0cd3ad3369577",
      measurementId: "G-TND3G03MEM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // الاستماع المباشر للتغييرات
    onSnapshot(doc(db, "siteData", "mainConfig"), (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.data();

        if (data.pageTitle) {
          document.title = data.pageTitle;
          document.getElementById('pageTitleDisplay').textContent = data.pageTitle;
        }
        if (data.subTitle) document.getElementById('subTitleDisplay').textContent = data.subTitle;
        if (data.msgTitle) document.getElementById('msgTitleDisplay').textContent = data.msgTitle;
        if (data.msgBody) document.getElementById('msgBodyDisplay').textContent = data.msgBody;
        if (data.counterSubText) document.getElementById('counterSubDisplay').textContent = data.counterSubText;
        
        if (data.heroImage) {
          const img = document.getElementById('heroImgDisplay');
          img.src = data.heroImage;
          img.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
