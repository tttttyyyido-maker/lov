<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="siteTitle">قصتنا 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #FFCBD7;
      color: #7A2846;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { color: #C03960; margin-bottom: 10px; }
    p { margin-bottom: 15px; font-weight: 600; }
    .hero-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #FF85A2;
      margin: 15px 0;
    }
    .message-box {
      background: #FFF0F3;
      padding: 20px;
      border-radius: 16px;
      border: 1px dashed #FF85A2;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="displayPageTitle">جاري التحميل...</h1>
    <p id="displaySubTitle">💕 Our Love Story</p>
    
    <img id="displayHeroImage" src="" class="hero-img" alt="صورة" style="display:none;">

    <div class="message-box">
      <h2 id="displayMsgTitle" style="color: #C03960; margin-bottom: 10px;">...</h2>
      <p id="displayMsgBody">...</p>
    </div>

    <div style="margin-top:25px;">
      <p id="displayCounterSub">...</p>
    </div>
  </div>

  <!-- ربط استقبال التحديثات اللحظية من Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFHcU7H24qU3OlJRdTe27ZxgwnFRzYxvE",
      authDomain: "love-18e03.firebaseapp.com",
      projectId: "love-18e03",
      storageBucket: "love-18e03.firebasestorage.app",
      messagingSenderId: "716078539990",
      appId: "1:716078539990:web:6198dd38a0cd3ad3369577",
      measurementId: "G-TND3G03MEM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // الاستماع الحقيقي المباشر (Realtime Listener)
    onSnapshot(doc(db, "siteData", "mainConfig"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();

        if (data.pageTitle) {
          document.title = data.pageTitle;
          document.getElementById('displayPageTitle').textContent = data.pageTitle;
        }
        if (data.subTitle) document.getElementById('displaySubTitle').textContent = data.subTitle;
        if (data.msgTitle) document.getElementById('displayMsgTitle').textContent = data.msgTitle;
        if (data.msgBody) document.getElementById('displayMsgBody').textContent = data.msgBody;
        if (data.counterSubText) document.getElementById('displayCounterSub').textContent = data.counterSubText;
        
        if (data.heroImage) {
          const imgEl = document.getElementById('displayHeroImage');
          imgEl.src = data.heroImage;
          imgEl.style.display = 'inline-block';
        }
      }
    });
  </script>
</body>
</html>
