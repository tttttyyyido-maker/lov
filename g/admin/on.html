<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: #FFE3E9; padding: 20px; direction: rtl; }
    .dashboard-container { max-width: 600px; margin: 0 auto; }
    .admin-card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1, h2 { color: #C03960; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; text-align: right; }
    label { display: block; font-weight: 700; color: #8C2443; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 10px; border: 1.5px solid #FFD3DD; border-radius: 10px; font-family: 'Cairo'; font-size: 1em; }
    .btn-save { width: 100%; padding: 15px; background: #E2507B; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .btn-save:hover { background: #C03960; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1>لوحة التحكم 💖✨</h1>
    
    <form id="dashboardForm">
      <div class="admin-card">
        <h2>🔑 الصفحة الرئيسية</h2>
        <div class="form-group">
          <label>العنوان الرئيسي</label>
          <input type="text" id="pageTitle" value="شهوتي 💕💕">
        </div>
        <div class="form-group">
          <label>العنوان الفرعي</label>
          <input type="text" id="subTitle" value="💕 Our Love Story">
        </div>
        <div class="form-group">
          <label>رابط الصورة (URL)</label>
          <input type="text" id="heroImage" value="https://res.cloudinary.com/demo/image/upload/sample.jpg">
        </div>
      </div>

      <div class="admin-card">
        <h2>✉️ الرسالة</h2>
        <div class="form-group">
          <label>عنوان الرسالة</label>
          <input type="text" id="msgTitle" value="ينور عيني 💕">
        </div>
        <div class="form-group">
          <label>نص الرسالة</label>
          <textarea id="msgBody" rows="4">بحبك اوي يا حته مني ربنا يخليكي ليا يا شهوتي ونبقا سوا طول العمررر كلو يا اغلي ما ف حياتي😍💖</textarea>
        </div>
      </div>

      <div class="admin-card">
        <h2>⏰ العداد والتاريخ</h2>
        <div class="form-group">
          <label>التاريخ (YYYY-MM-DD)</label>
          <input type="text" id="startDate" value="2026-03-08">
        </div>
        <div class="form-group">
          <label>النص السفلي</label>
          <input type="text" id="counterSubText" value="كل ثانية بتعدي وانت في قلبي 💕">
        </div>
      </div>

      <button type="submit" class="btn-save">💾 حفظ وتحديث الموقع فوراً</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFHcU7H24qU3OlJRdTe27ZxgwnFRzYxvE",
      authDomain: "love-18e03.firebaseapp.com",
      projectId: "love-18e03",
      storageBucket: "love-18e03.firebasestorage.app",
      messagingSenderId: "716078539990",
      appId: "1:716078539990:web:6198dd38a0cd3ad3369577",
      measurementId: "G-TND3G03MEM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "siteData", "mainConfig");

    // جلب البيانات فور التحميل
    async function loadData() {
      try {
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          const d = snap.data();
          if(d.pageTitle) document.getElementById('pageTitle').value = d.pageTitle;
          if(d.subTitle) document.getElementById('subTitle').value = d.subTitle;
          if(d.heroImage) document.getElementById('heroImage').value = d.heroImage;
          if(d.msgTitle) document.getElementById('msgTitle').value = d.msgTitle;
          if(d.msgBody) document.getElementById('msgBody').value = d.msgBody;
          if(d.startDate) document.getElementById('startDate').value = d.startDate;
          if(d.counterSubText) document.getElementById('counterSubText').value = d.counterSubText;
        }
      } catch(e) { console.error(e); }
    }
    loadData();

    // حفظ البيانات
    document.getElementById('dashboardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const updatedData = {
        pageTitle: document.getElementById('pageTitle').value,
        subTitle: document.getElementById('subTitle').value,
        heroImage: document.getElementById('heroImage').value,
        msgTitle: document.getElementById('msgTitle').value,
        msgBody: document.getElementById('msgBody').value,
        startDate: document.getElementById('startDate').value,
        counterSubText: document.getElementById('counterSubText').value,
        updatedAt: new Date()
      };

      try {
        await setDoc(docRef, updatedData, { merge: true });
        alert("✨ تم الحفظ بنجاح! افتح الصفحة الرئيسية الآن.");
      } catch (err) {
        alert("❌ حدث خطأ، تأكد من إعدادات الـ Rules في الفايربيس.");
      }
    });
  </script>
</body>
</html>
