<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">تسجيل الدخول - لوحة التحكم</title>
  
  <!-- SEO & Favicon -->
  <meta name="description" content="صفحة تسجيل دخول المسؤول للوصول إلى لوحة تحكم الموقع">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts (Tajawal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">

  <!-- Screen Loading Overlay -->
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p>جاري التحقق من البيانات...</p>
  </div>

  <!-- Login Main Container -->
  <main class="login-wrapper">
    <div class="login-card">
      
      <!-- Login Header & Photo -->
      <div class="login-header text-center">
        <div class="login-photo-wrapper">
          <img id="login-photo" src="assets/placeholder-login.jpg" alt="صورة تسجيل الدخول" class="login-img">
        </div>
        <h1 id="login-title-display" class="login-title">تسجيل الدخول</h1>
        <p id="login-subtitle-display" class="login-subtitle">أدخل بيانات المسؤول للوصول للوحة التحكم</p>
      </div>

      <!-- Alert Box for Error/Success Messages -->
      <div id="login-alert" class="alert-box hidden" role="alert"></div>

      <!-- Authentication Form -->
      <form id="admin-login-form" class="login-form" novalidate>
        
        <!-- Email Input Group -->
        <div class="form-group">
          <label for="admin-email">
            <i class="fa-solid fa-envelope"></i> البريد الإلكتروني
          </label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="admin-email" 
              name="email" 
              placeholder="admin@example.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Input Group -->
        <div class="form-group">
          <label for="admin-password">
            <i class="fa-solid fa-key"></i> كلمة السر
          </label>
          <div class="input-wrapper password-input-wrapper">
            <input 
              type="password" 
              id="admin-password" 
              name="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="عرض كلمة السر">
              <i class="fa-solid fa-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn-primary btn-block">
          <span class="btn-text">تسجيل الدخول</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>

      </form>

      <!-- Footer Back Link -->
      <div class="login-footer text-center">
        <a href="index.html" class="back-home-link">
          <i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية
        </a>
      </div>

    </div>
  </main>

  <!-- Login Logic Script (Module) -->
  <script type="module">
    import { auth, db } from './firebase.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loadingScreen = document.getElementById('loading-screen');
    const loginForm = document.getElementById('admin-login-form');
    const emailInput = document.getElementById('admin-email');
    const passwordInput = document.getElementById('admin-password');
    const loginAlert = document.getElementById('login-alert');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const toggleIcon = document.getElementById('toggle-icon');

    // العناصر القابلة للتخصيص من Firestore
    const loginPhotoEl = document.getElementById('login-photo');
    const loginTitleEl = document.getElementById('login-title-display');
    const loginSubtitleEl = document.getElementById('login-subtitle-display');

    // 1. فحص حالة الدخول المسبقة وتحميل الإعدادات المخصصة من Firestore
    document.addEventListener('DOMContentLoaded', async () => {
      // التحقق مما إذا كان الأدمن مسجل دخوله بالفعل
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = 'admin/index.html';
        } else {
          hideLoading();
        }
      });

      // جلب بيانات تخصيص واجهة الدخول من Firestore
      try {
        const settingsRef = doc(db, 'settings', 'site_config');
        const docSnap = await getDoc(settingsRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.login_title) loginTitleEl.textContent = data.login_title;
          if (data.login_subtitle) loginSubtitleEl.textContent = data.login_subtitle;
          if (data.login_photo) loginPhotoEl.src = data.login_photo;
        }
      } catch (error) {
        console.error("خطأ أثناء جلب إعدادات صفحة الدخول:", error);
      }
    });

    // 2. إظهار/إخفاء كلمة السر
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    // 3. معالجة نموذج تسجيل الدخول
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showAlert('يرجى إدخال البريد الإلكتروني وكلمة السر.', 'error');
        return;
      }

      showLoading();
      hideAlert();

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showAlert('تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');
        setTimeout(() => {
          window.location.href = 'admin/index.html';
        }, 1000);
      } catch (error) {
        hideLoading();
        console.error("خطأ في تسجيل الدخول:", error);
        
        let message = 'حدث خطأ أثناء تسجيل الدخول. يرجى التأكد من البيانات.';
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          message = 'البريد الإلكتروني أو كلمة السر غير صحيحة.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'تم حظر المحاولات مؤقتًا لكثرة المحاولات الخاطئة. حاول لاحقًا.';
        }
        
        showAlert(message, 'error');
      }
    });

    // دوال مساعدة للاستخدام المحلي
    function showLoading() {
      loadingScreen.classList.remove('hidden');
    }

    function hideLoading() {
      loadingScreen.classList.add('hidden');
    }

    function showAlert(msg, type) {
      loginAlert.textContent = msg;
      loginAlert.className = `alert-box alert-${type}`;
      loginAlert.classList.remove('hidden');
    }

    function hideAlert() {
      loginAlert.classList.add('hidden');
    }
  </script>

</body>
</html>
