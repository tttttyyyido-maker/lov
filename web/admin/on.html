<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFE5EC 0%, #FFC9DD 25%, #FFB3C6 50%, #FFDAB9 75%, #FFF9F0 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 30px 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; color: #D4567A; font-weight: 700; text-shadow: 2px 2px 6px rgba(212, 86, 122, 0.3); }
        .header p { color: #A8677E; margin-top: 8px; font-size: 1em; }

        .logout-btn {
            position: fixed; top: 20px; left: 20px;
            padding: 10px 20px; background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.5); border-radius: 12px;
            color: #D4567A; font-family: 'Cairo', sans-serif; font-weight: 700;
            cursor: pointer; text-decoration: none; font-size: 0.9em;
            transition: all 0.3s; z-index: 100;
        }
        .logout-btn:hover { background: #D4567A; color: white; }

        .dashboard { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }

        .card {
            background: rgba(255, 255, 255, 0.98); border-radius: 25px; padding: 35px;
            box-shadow: 0 15px 50px rgba(234, 184, 167, 0.4); border: 3px solid rgba(255, 182, 193, 0.3);
        }

        .card-title {
            font-size: 1.4em; color: #D4567A; font-weight: 700;
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 2px dashed rgba(255, 182, 193, 0.4);
            display: flex; align-items: center; gap: 10px;
        }

        .field-group { margin-bottom: 20px; }
        .field-group label { display: block; margin-bottom: 8px; color: #630404; font-weight: 600; font-size: 0.95em; }

        .field-group input, .field-group textarea {
            width: 100%; padding: 14px 18px;
            border: 3px solid rgba(255, 182, 193, 0.4); border-radius: 15px;
            font-size: 1em; font-family: 'Cairo', sans-serif;
            background: rgba(255, 245, 248, 0.8); color: #630404;
            transition: all 0.3s ease; resize: vertical;
        }
        .field-group input:focus, .field-group textarea:focus {
            outline: none; border-color: #FFB6C1; background: white;
            box-shadow: 0 5px 20px rgba(255, 182, 193, 0.3);
        }
        .field-group textarea { min-height: 120px; line-height: 1.8; }

        .admin-pass-box {
            background: rgba(255, 220, 100, 0.12);
            border: 2.5px dashed rgba(212, 86, 122, 0.35);
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }
        .admin-pass-box label {
            display: block; margin-bottom: 8px;
            color: #D4567A; font-weight: 700; font-size: 0.95em;
        }
        .admin-pass-box input {
            width: 100%; padding: 14px 18px;
            border: 3px solid rgba(212, 86, 122, 0.3); border-radius: 12px;
            font-size: 1em; font-family: 'Cairo', sans-serif;
            background: rgba(255, 245, 248, 0.9); color: #630404;
            transition: all 0.3s ease;
        }
        .admin-pass-box input:focus {
            outline: none; border-color: #D4567A; background: white;
            box-shadow: 0 5px 20px rgba(212, 86, 122, 0.2);
        }
        .admin-pass-note { font-size: 0.8em; color: #A8677E; margin-top: 7px; }

        .media-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .media-item { display: flex; gap: 10px; align-items: center; }
        .media-item input {
            flex: 1; padding: 12px 15px; border: 3px solid rgba(255, 182, 193, 0.4);
            border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 0.9em;
            background: rgba(255, 245, 248, 0.8); color: #630404; transition: all 0.3s;
        }
        .media-item input:focus { outline: none; border-color: #FFB6C1; background: white; }

        .delete-btn {
            padding: 10px 15px; background: rgba(255, 100, 100, 0.1);
            border: 2px solid rgba(255, 100, 100, 0.3); border-radius: 10px;
            color: #cc0000; cursor: pointer; font-size: 1em; transition: all 0.3s;
        }
        .delete-btn:hover { background: rgba(255, 100, 100, 0.2); }

        .add-btn {
            padding: 10px 20px; background: rgba(255, 182, 193, 0.2);
            border: 2px dashed rgba(255, 182, 193, 0.6); border-radius: 12px;
            color: #D4567A; cursor: pointer; font-family: 'Cairo', sans-serif;
            font-size: 0.95em; font-weight: 600; transition: all 0.3s; width: 100%;
        }
        .add-btn:hover { background: rgba(255, 182, 193, 0.3); }

        .upload-btn {
            padding: 10px 18px; background: linear-gradient(135deg, #FFB3C6, #FF69B4);
            border: none; border-radius: 12px; color: white;
            font-family: 'Cairo', sans-serif; font-size: 0.9em; font-weight: 700;
            cursor: pointer; transition: all 0.3s; width: 100%; margin-top: 8px;
        }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,105,180,0.4); }
        .upload-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .sentences-list { display: flex; flex-direction: column; gap: 12px; }
        .sentence-item { display: flex; gap: 10px; align-items: center; }
        .sentence-num {
            background: linear-gradient(135deg, #FFB3C6, #FFDAB9); color: #630404;
            width: 35px; height: 35px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: 700; font-size: 0.9em; flex-shrink: 0;
        }
        .sentence-item input {
            flex: 1; padding: 12px 15px; border: 3px solid rgba(255, 182, 193, 0.4);
            border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 0.95em;
            background: rgba(255, 245, 248, 0.8); color: #630404; transition: all 0.3s;
        }
        .sentence-item input:focus { outline: none; border-color: #FFB6C1; background: white; }

        .save-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #FFB3C6, #EAB8A7, #FFDAB9);
            border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 15px;
            color: #630404; font-size: 1.3em; font-weight: 700; cursor: pointer;
            font-family: 'Cairo', sans-serif; box-shadow: 0 10px 30px rgba(234, 184, 167, 0.5);
            transition: all 0.4s ease; margin-top: 10px;
        }
        .save-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(234, 184, 167, 0.7); }

        .label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .label-row label { margin-bottom: 0 !important; }

        .help-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; background: linear-gradient(135deg, #FFB3C6, #FF69B4);
            border: none; border-radius: 50%; color: white; font-size: 0.75em; font-weight: 700;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0; line-height: 1; font-family: Arial, sans-serif;
        }
        .help-btn:hover { transform: scale(1.15); box-shadow: 0 3px 10px rgba(255, 105, 180, 0.4); }

        .preview-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9999;
            align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px);
        }
        .preview-overlay.active { display: flex; }

        .preview-modal {
            background: white; border-radius: 20px; padding: 25px; max-width: 520px; width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25); position: relative; animation: modalPop 0.25s ease;
        }
        @keyframes modalPop {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        .preview-modal h3 { color: #D4567A; font-size: 1.1em; margin-bottom: 12px; font-weight: 700; }
        .preview-modal p { color: #888; font-size: 0.9em; margin-bottom: 15px; line-height: 1.7; }
        .preview-modal img { width: 100%; border-radius: 12px; border: 3px solid rgba(255,182,193,0.35); object-fit: cover; }

        .preview-close {
            position: absolute; top: 12px; left: 12px; width: 30px; height: 30px;
            background: rgba(255,100,100,0.1); border: none; border-radius: 50%; color: #cc0000;
            font-size: 1.1em; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .preview-close:hover { background: rgba(255,100,100,0.2); }

        .preview-badge {
            display: inline-block; background: rgba(255,182,193,0.2);
            border: 1.5px solid rgba(255,182,193,0.5); color: #D4567A;
            font-size: 0.78em; padding: 3px 10px; border-radius: 20px; margin-bottom: 12px;
        }
        #statusMsg { font-weight: bold; text-align: center; margin-top: 15px; color: #D4567A; }
    </style>
</head>
<body>

    <a href="../index.html" class="logout-btn">🚪 خروج</a>
    <a href="../lo2.html" class="logout-btn" style="left:130px;">👁️ معاينة</a>

    <div class="header">
        <h1>💖 لوحة التحكم</h1>
        <p>عدّل كل حاجة من هنا اي وقت زي ما تحب💕</p>
    </div>

    <!-- Modal المساعدة البصرية -->
    <div class="preview-overlay" id="previewOverlay" data-action="closePreview">
        <div class="preview-modal">
            <button class="preview-close" data-action="closeHelp">✕</button>
            <div class="preview-badge" id="previewBadge">مثال توضيحي</div>
            <h3 id="previewTitle">العنوان</h3>
            <p id="previewDesc">الوصف</p>
            <img id="previewImg" src="" alt="مثال توضيحي" data-hideonerror="1">
        </div>
    </div>

    <form id="adminForm" onsubmit="return false;" class="dashboard" autocomplete="off">

        <!-- صفحة اللوجن -->
        <div class="card">
            <h2 class="card-title">🔐 اول صفحه </h2>
            <div class="field-group">
                <div class="label-row">
                    <label>عنوان الصفحة (Enter Password)</label>
                    <button type="button" class="help-btn" data-help="login_title">?</button>
                </div>
                <input type="text" id="login_title" value="شهوتي 💗💗" placeholder="Enter Password">
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>النص التاني (Our Love Story)</label>
                    <button type="button" class="help-btn" data-help="login_subtitle">?</button>
                </div>
                <input type="text" id="login_subtitle" value="" placeholder="Our Love Story 💕">
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>🔑 باسورد الزوار</label>
                    <button type="button" class="help-btn" data-help="password">?</button>
                </div>
                <input type="text" id="client_password" value="" placeholder="سيبه فاضي لو مش عايز تغيّره">
            </div>

            <div class="field-group">
                <div class="label-row">
                    <label>🖼️ صورة دائرية في الاول (اختياري)</label>
                    <button type="button" class="help-btn" data-help="login_photo">?</button>
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <input type="text" id="login_photo" value="" placeholder="رابط الصورة https://...">
                    <button type="button" class="upload-btn" style="white-space:nowrap;padding:10px 14px;" data-clicktrigger="loginPhotoInput">📁 ارفع</button>
                    <input type="file" id="loginPhotoInput" accept="image/*" style="display:none" data-uploadsingle="login_photo">
                </div>
            </div>
        </div>

        <!-- الرسالة الطويلة -->
        <div class="card">
            <h2 class="card-title">💌 اول ماسدج</h2>
            <div class="field-group">
                <div class="label-row">
                    <label>العنوان (ينور عيني)</label>
                    <button type="button" class="help-btn" data-help="main_title">?</button>
                </div>
                <input type="text" id="main_title" value="ينور عيني 💞" placeholder="ينور عيني 💕">
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>الرسالة الطويلة</label>
                    <button type="button" class="help-btn" data-help="main_message">?</button>
                </div>
                <textarea id="main_message" rows="8">بحبك اويي يا حته مني ربنا يخليكي ليا يا شهوتي ونبقا سوا طول العمررر كلو يا اغلي ما ف حياتي😍💗</textarea>
            </div>
        </div>

        <!-- الصورة الكبيرة والعنوانات -->
        <div class="card">
            <h2 class="card-title">🖼️ الصفحة التانية — اول صوره</h2>
            <div class="field-group">
                <div class="label-row">
                    <label>اول صوره (بتملي الشاشة)</label>
                    <button type="button" class="help-btn" data-help="hero_photo">?</button>
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <input type="text" id="hero_photo" value="" placeholder="https://... (لو فاضي بياخد أول صورة)">
                    <button type="button" class="upload-btn" style="white-space:nowrap;padding:10px 14px;" data-clicktrigger="heroPhotoInput">📁 ارفع</button>
                    <input type="file" id="heroPhotoInput" accept="image/*" style="display:none" data-uploadsingle="hero_photo">
                </div>
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>الي في نص اول صوره(badge)</label>
                    <button type="button" class="help-btn" data-help="hero_badge">?</button>
                </div>
                <input type="text" id="hero_badge" value="بحبك" placeholder="بحبك 💕">
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>فوق العداد</label>
                    <button type="button" class="help-btn" data-help="page2_title">?</button>
                </div>
                <input type="text" id="page2_title" value="بدايه القصه♥️🤙" placeholder="بدايتنا 💞">
            </div>
        </div>

        <!-- التاريخ والعداد -->
        <div class="card">
            <h2 class="card-title">⏰ التاريخ والعداد</h2>
            <div class="field-group">
                <div class="label-row">
                    <label>📅 التاريخ (من إمتى سوا)</label>
                    <button type="button" class="help-btn" data-help="date">?</button>
                </div>
                <input type="date" id="date" value="2026-03-08">
            </div>
            <div class="field-group">
                <div class="label-row">
                    <label>النص تحت العداد</label>
                    <button type="button" class="help-btn" data-help="countdown_sub">?</button>
                </div>
                <input type="text" id="countdown_sub" value="" placeholder="كل ثانية بتعدي وانتِ في قلبي ❤️">
            </div>
        </div>

        <!-- الكابشنات المميزة -->
        <div class="card">
            <h2 class="card-title" style="justify-content:space-between;">
                تواريخ مميزه
                <button type="button" class="help-btn" data-help="captions" style="width:26px;height:26px;font-size:0.85em;">?</button>
            </h2>
            <div class="media-list" id="captions-list"></div>
            <button type="button" class="add-btn" data-action="addCaption">+ إضافة كابشن</button>
        </div>

        <!-- الأغاني -->
        <div class="card">
            <h2 class="card-title" style="justify-content:space-between;">
                🎵 الأغاني
                <button type="button" class="help-btn" data-help="songs" style="width:26px;height:26px;font-size:0.85em;">?</button>
            </h2>
            <div class="media-list" id="songs-list"></div>
            <div style="display:flex;gap:10px;margin-top:5px;">
                <button type="button" class="upload-btn" id="songBtnUpload" style="flex:1" data-clicktrigger="songFileInput">🎵 ضيف أغنية من جهازك</button>
                <input type="file" id="songFileInput" accept="audio/*,video/*" style="display:none" data-uploadsong="1">
            </div>
        </div>

        <!-- الصور -->
        <div class="card">
            <h2 class="card-title" style="justify-content:space-between;">
                🖼️ الصور
                <button type="button" class="help-btn" data-help="photos" style="width:26px;height:26px;font-size:0.85em;">?</button>
            </h2>
            <div class="media-list" id="photos-list"></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="upload-btn" id="photoBtnUpload" data-clicktrigger="photoFileInput">📁 ضيف صورة من جهازك </button>
                <input type="file" id="photoFileInput" accept="image/*" style="display:none" data-uploadfile="image">
            </div>
        </div>

        <!-- الفيديوهات -->
        <div class="card">
            <h2 class="card-title" style="justify-content:space-between;">
                🎥 الفيديوهات
                <button type="button" class="help-btn" data-help="videos" style="width:26px;height:26px;font-size:0.85em;">?</button>
            </h2>
            <div class="media-list" id="videos-list"></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="upload-btn" id="videoBtnUpload" data-clicktrigger="videoFileInput">🎬 ضيف فيديو من جهازك </button>
                <input type="file" id="videoFileInput" accept="video/*" style="display:none" data-uploadfile="video">
            </div>
        </div>

        <!-- الجمل -->
        <div class="card">
            <h2 class="card-title" style="justify-content:space-between;">
                💬 الجمل في صفحة الرسالة
                <button type="button" class="help-btn" data-help="sentences" style="width:26px;height:26px;font-size:0.85em;">?</button>
            </h2>
            <div class="sentences-list" id="sentences-list"></div>
            <button type="button" class="add-btn" data-action="addSentence" style="margin-top:12px">+ إضافة جملة</button>
        </div>

        <!-- زر الحفظ ورسالة الحالة -->
        <button type="button" id="saveAllBtn" class="save-btn">save💾</button>
        <div id="statusMsg"></div>

    </form>

<script type="module">
    // 1. كلمة سر دخول لوحة التحكم
    const ADMIN_PASSWORD = "123456";
    const userPass = prompt("برجاء أدخل كلمة السر للدخول إلى لوحة التحكم:");
    if (userPass !== ADMIN_PASSWORD) {
        alert("كلمة السر غير صحيحة!");
        window.location.href = "../index.html";
    }

    // 2. استدعاء Firebase
    import { db, storage, doc, setDoc, getDoc } from "../firebase.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

    const siteDocRef = doc(db, "site", "main");

    // تحميل البيانات القديمة من Firestore
    async function loadFirebaseData() {
        try {
            const snap = await getDoc(siteDocRef);
            if(snap.exists()){
                const d = snap.data();
                if(d.login_title) document.getElementById('login_title').value = d.login_title;
                if(d.login_subtitle) document.getElementById('login_subtitle').value = d.login_subtitle;
                if(d.client_password) document.getElementById('client_password').value = d.client_password;
                if(d.login_photo) document.getElementById('login_photo').value = d.login_photo;
                if(d.main_title) document.getElementById('main_title').value = d.main_title;
                if(d.main_message) document.getElementById('main_message').value = d.main_message;
                if(d.hero_photo) document.getElementById('hero_photo').value = d.hero_photo;
                if(d.hero_badge) document.getElementById('hero_badge').value = d.hero_badge;
                if(d.page2_title) document.getElementById('page2_title').value = d.page2_title;
                if(d.date) document.getElementById('date').value = d.date;
                if(d.countdown_sub) document.getElementById('countdown_sub').value = d.countdown_sub;

                // تحميل القوائم الديناميكية
                if(d.captions && Array.isArray(d.captions)) {
                    d.captions.forEach(c => addCaption(c.text, c.date));
                }
                if(d.songs && Array.isArray(d.songs)) {
                    d.songs.forEach(s => addSong(s.url, s.name));
                }
                if(d.photos && Array.isArray(d.photos)) {
                    d.photos.forEach(p => addPhoto(p.url, p.caption));
                }
                if(d.videos && Array.isArray(d.videos)) {
                    d.videos.forEach(v => addVideo(v));
                }
                if(d.sentences && Array.isArray(d.sentences)) {
                    d.sentences.forEach(s => addSentence(s));
                }
            }
        } catch(e) {
            console.error("خطأ في قراءة البيانات:", e);
        }
    }
    loadFirebaseData();

    // دالة الرفع إلى Firebase Storage
    async function uploadToStorage(file, folder) {
        const fileRef = ref(storage, `${folder}/${Date.now()}_${file.name}`);
        const snapshot = await uploadBytes(fileRef, file);
        return await getDownloadURL(snapshot.ref);
    }

    // رفع الملفات الفردية (مثل صوة اللوجن أو صوة الهاتف)
    window.uploadSingle = async function(input, targetId) {
        const file = input.files[0];
        if(!file) return;
        try {
            document.getElementById('statusMsg').textContent = "جاري رفع الصورة...";
            const url = await uploadToStorage(file, 'images');
            document.getElementById(targetId).value = url;
            document.getElementById('statusMsg').textContent = "تم رفع الصورة بنجاح!";
        } catch(e) {
            alert("حدث خطأ أثناء الرفع");
        }
    }

    // رفع فيديو/صوت/صورة للقوائم
    window.uploadFile = async function(input, type) {
        const file = input.files[0];
        if(!file) return;
        const btn = document.getElementById(type === 'video' ? 'videoBtnUpload' : 'photoBtnUpload');
        const origText = btn.textContent;
        btn.textContent = "⏳ جاري الرفع...";
        btn.disabled = true;

        try {
            const folder = type === 'video' ? 'videos' : 'images';
            const url = await uploadToStorage(file, folder);
            if(type === 'video') addVideo(url);
            else addPhoto(url, "");
            btn.textContent = "✅ اترفع بنجاح!";
            setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
        } catch(e) {
            alert("حدث خطأ أثناء الرفع");
            btn.textContent = origText; btn.disabled = false;
        }
    }

    window.uploadSong = async function(input) {
        const file = input.files[0];
        if(!file) return;
        const btn = document.getElementById('songBtnUpload');
        const origText = btn.textContent;
        btn.textContent = "⏳ جاري الرفع...";
        btn.disabled = true;

        try {
            const url = await uploadToStorage(file, 'audio');
            addSong(url, file.name);
            btn.textContent = "✅ اترفع بنجاح!";
            setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
        } catch(e) {
            alert("حدث خطأ أثناء الرفع");
            btn.textContent = origText; btn.disabled = false;
        }
    }

    // حفظ جميع البيانات داخل Firebase Firestore
    document.getElementById('saveAllBtn').addEventListener('click', async () => {
        const status = document.getElementById('statusMsg');
        status.textContent = "جاري الحفظ في القاعدة...";

        // تجميع البيانات
        const captions = Array.from(document.querySelectorAll('#captions-list .media-item')).map(item => ({
            text: item.querySelector('input[type="text"]').value,
            date: item.querySelector('input[type="date"]').value
        }));

        const songs = Array.from(document.querySelectorAll('#songs-list .media-item')).map(item => ({
            url: item.querySelectorAll('input[type="text"]')[0].value,
            name: item.querySelectorAll('input[type="text"]')[1].value
        }));

        const photos = Array.from(document.querySelectorAll('#photos-list .media-item')).map(item => ({
            url: item.querySelectorAll('input[type="text"]')[0].value,
            caption: item.querySelectorAll('input[type="text"]')[1].value
        }));

        const videos = Array.from(document.querySelectorAll('#videos-list input[name="videos[]"]')).map(input => input.value);
        const sentences = Array.from(document.querySelectorAll('#sentences-list input[name="sentences[]"]')).map(input => input.value);

        const dataToSave = {
            login_title: document.getElementById('login_title').value,
            login_subtitle: document.getElementById('login_subtitle').value,
            client_password: document.getElementById('client_password').value,
            login_photo: document.getElementById('login_photo').value,
            main_title: document.getElementById('main_title').value,
            main_message: document.getElementById('main_message').value,
            hero_photo: document.getElementById('hero_photo').value,
            hero_badge: document.getElementById('hero_badge').value,
            page2_title: document.getElementById('page2_title').value,
            date: document.getElementById('date').value,
            countdown_sub: document.getElementById('countdown_sub').value,
            captions, songs, photos, videos, sentences,
            updatedAt: new Date().toISOString()
        };

        try {
            await setDoc(siteDocRef, dataToSave, { merge: true });
            status.textContent = "✅ تم حفظ التغييرات بنجاح وتحديث الموقع المباشر!";
        } catch(e) {
            console.error(e);
            status.textContent = "❌ حدث خطأ أثناء عملية الحفظ!";
        }
    });

    // --------------------------------------------------
    // الدوال الخاصة بإضافة القوائم
    // --------------------------------------------------
    window.addCaption = function(text = "", dateVal = "") {
        const list = document.getElementById('captions-list');
        const div = document.createElement('div');
        div.className = 'media-item';
        div.style.cssText = 'flex-direction:column;align-items:stretch;gap:8px;';
        div.innerHTML = `
            <div style="display:flex;gap:10px;align-items:center;">
                <input type="text" value="${text}" placeholder="يوم ما قولتلك بحبك...">
                <input type="date" value="${dateVal}" style="max-width:155px;">
                <button type="button" class="delete-btn" data-remove="media-item">🗑️</button>
            </div>
        `;
        list.appendChild(div);
    }

    window.addSong = function(url = "", name = "") {
        const list = document.getElementById('songs-list');
        const div = document.createElement('div');
        div.className = 'media-item';
        div.style.cssText = 'flex-direction:column;align-items:stretch;gap:8px;';
        div.innerHTML = `
            <div style="display:flex;gap:10px;align-items:center;">
                <input type="text" name="song_urls[]" value="${url}" placeholder="رابط الأغنية https://...">
                <button type="button" class="delete-btn" data-remove="media-item">🗑️</button>
            </div>
            <input type="text" name="song_names[]" value="${name}" placeholder="اسم الأغنية" style="border-radius:12px;padding:10px 15px;border:3px solid rgba(255,182,193,0.4);font-family:Cairo,sans-serif;font-size:0.88em;background:rgba(255,245,248,0.8);color:#630404;">
        `;
        list.appendChild(div);
    }

    window.addPhoto = function(url = "", caption = "") {
        const list = document.getElementById('photos-list');
        const div = document.createElement('div');
        div.className = 'media-item';
        div.style.cssText = 'flex-direction:column; align-items:stretch; gap:8px;';
        div.innerHTML = `
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="text" name="photos[]" value="${url}" placeholder="رابط الصورة https://...">
                <button type="button" class="delete-btn" data-remove="media-item">🗑️</button>
            </div>
            <input type="text" name="photo_captions[]" value="${caption}" placeholder="الجملة تحت الصورة (اختياري)..." style="border-radius:12px; padding:10px 15px; border:3px solid rgba(255,182,193,0.4); font-family:Cairo,sans-serif; font-size:0.9em; background:rgba(255,245,248,0.8); color:#630404;">
        `;
        list.appendChild(div);
    }

    window.addVideo = function(url = "") {
        const list = document.getElementById('videos-list');
        const div = document.createElement('div');
        div.className = 'media-item';
        div.innerHTML = `
            <input type="text" name="videos[]" value="${url}" placeholder="رابط الفيديو https://...">
            <button type="button" class="delete-btn" data-remove="media-item">🗑️</button>
        `;
        list.appendChild(div);
    }

    window.addSentence = function(text = "") {
        const list = document.getElementById('sentences-list');
        const num = list.children.length + 1;
        const div = document.createElement('div');
        div.className = 'sentence-item';
        div.innerHTML = `
            <div class="sentence-num">${num}</div>
            <input type="text" name="sentences[]" value="${text}" placeholder="جملة ${num}">
            <button type="button" class="delete-btn" data-remove="sentence-item">🗑️</button>
        `;
        list.appendChild(div);
    }
</script>

        sentences: { badge: 'الجمل', title: '💬 جمل بتظهر في اخر صفحه', desc: 'اخر جمل اكتب/ي من كل قلبك', img: 'https://res.cloudinary.com/dgrsuc68m/image/upload/v1776551611/clients/xkr0gqkv8vucfen6t94f.jpg' }

    function showHelp(key) {
        const d = HELP_DATA[key];
        if (!d) return;
        document.getElementById('previewBadge').textContent = d.badge;
        document.getElementById('previewTitle').textContent = d.title;
        document.getElementById('previewDesc').textContent = d.desc;
        const img = document.getElementById('previewImg');
        if (d.img) {
            img.src = d.img;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
        document.getElementById('previewOverlay').classList.add('active');
    }

    function closeHelp() { document.getElementById('previewOverlay').classList.remove('active'); }
    function closePreview(e) { if (e.target === document.getElementById('previewOverlay')) closeHelp(); }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });

    document.addEventListener('click', function(e){
        var t = e.target.closest('[data-action],[data-help],[data-clicktrigger],[data-remove]');
        if(!t) return;
        if('help' in t.dataset){ showHelp(t.dataset.help); return; }
        if('clicktrigger' in t.dataset){
            var el = document.getElementById(t.dataset.clicktrigger);
            if(el) el.click();
            return;
        }
        if('remove' in t.dataset){
            t.closest('.' + t.dataset.remove).remove();
            return;
        }
        var a = t.dataset.action;
        if(a === 'closePreview') closePreview(e);
        else if(a === 'closeHelp') closeHelp();
        else if(a === 'addCaption') window.addCaption();
        else if(a === 'addSentence') window.addSentence();
    });

    document.addEventListener('change', function(e){
        var t = e.target;
        if('uploadsong' in t.dataset) window.uploadSong(t);
        else if('uploadsingle' in t.dataset) window.uploadSingle(t, t.dataset.uploadsingle);
        else if('uploadfile' in t.dataset) window.uploadFile(t, t.dataset.uploadfile);
    });
</script>
