<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='pink'/><text x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='middle'>🔐</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFE5EC 0%, #FFC9DD 25%, #FFB3C6 50%, #FFDAB9 75%, #FFF9F0 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hearts-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            opacity: 0;
            animation: floatUp 15s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-150px) scale(1.2); opacity: 0; }
        }

        .floating-heart:nth-child(1) { left: 10%; font-size: 40px; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 30%; font-size: 50px; animation-delay: 3s; }
        .floating-heart:nth-child(3) { left: 60%; font-size: 45px; animation-delay: 6s; }
        .floating-heart:nth-child(4) { left: 80%; font-size: 42px; animation-delay: 9s; }

        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(234, 184, 167, 0.5);
            border: 4px solid rgba(255, 182, 193, 0.4);
            max-width: 450px;
            width: 100%;
        }

        .admin-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: iconFloat 3s infinite ease-in-out;
            display: block;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 2em;
            color: #D4567A;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #A8677E;
            margin-bottom: 35px;
            font-size: 1em;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #630404;
            font-weight: 600;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid rgba(255, 182, 193, 0.5);
            border-radius: 15px;
            font-size: 1em;
            font-family: 'Cairo', sans-serif;
            background: rgba(255, 255, 255, 0.95);
            color: #630404;
            text-align: center;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #FFB6C1;
            box-shadow: 0 5px 20px rgba(255, 182, 193, 0.4);
            transform: translateY(-2px);
        }

        .error-msg {
            background: rgba(255, 100, 100, 0.1);
            border: 2px solid rgba(255, 100, 100, 0.3);
            color: #cc0000;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FFB3C6, #EAB8A7, #FFDAB9);
            border: none;
            border-radius: 15px;
            color: #630404;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 30px rgba(234, 184, 167, 0.5);
            transition: all 0.4s ease;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(234, 184, 167, 0.7);
        }
    </style>
</head>
<body>
    <div class="hearts-container">
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💓</div>
    </div>

    <div class="login-box">
        <span class="admin-icon">🔐</span>
        <h1 class="title">لوحة التحكم</h1>
        <p class="subtitle">ادخل باسورد الادمن 💕</p>

        

              <form action="on.html" method="GET" autocomplete="off">
            <input type="hidden" name="csrf_token" value="9175c288b2f63afbb6e4cdefcabeaf97">
            <div class="input-group">
                <label>باسورد الادمن</label>
                <input type="password" name="admin_password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">🔓 دخول</button>
        </form>
    </div>
</body>
</html>
